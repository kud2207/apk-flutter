name: cv_express
description: Application Flutter CV Express avec Firebase et export PDF
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"  # Ajoute cette ligne pour spécifier la version du SDK Dart

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.25.4
  firebase_auth: ^4.17.5
  cloud_firestore: ^4.14.0
  firebase_storage: ^11.6.7
  file_picker: ^8.0.7  # Version downgrader de file_picker

  # Utilitaires
  image_picker: ^1.0.7
  pdf: ^3.10.7
  printing: ^5.12.0

  # UI
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/
